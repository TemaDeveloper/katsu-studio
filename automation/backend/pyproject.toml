[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "katsu-studio"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.10,<3", "httpx>=0.28,<1", "openai>=2,<4", "keyring>=25,<26", "Pillow>=11,<13", "num2words>=0.5.14,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["katsu*"]

[tool.setuptools.package-data]
katsu = ["assets/*.ttf", "assets/*.png", "assets/OFL.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../.."]
